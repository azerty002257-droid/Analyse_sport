version: '3.8'

services:
  server:
    build: .
    container_name: analysesport-football-server
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_TYPE=sqlite
      - DB_SQLITE_PATH=/app/data/analysesport.db
    volumes:
      - server-data:/app/data
      - server-logs:/app/logs
    restart: unless-stopped

volumes:
  server-data:
  server-logs: